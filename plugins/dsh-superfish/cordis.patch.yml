# 安装该 bundle 时接管输入准入（内置 Agent Loop Cap4 驱动，随本包发布）并集成定时任务宿主、GenUI 中间层、只读工作区上下文总线与大肥鱼主理/预设入口。
- id: schedule
  disabled: true
- id: agent-loop
  disabled: true
- insert:
    - id: input-admission-cap4
      name: '@local/dsh-superfish/input-admission'
      config:
        agents: []
        maxParallelToolCalls: 10
    - id: quick-actions-schedule-host
      name: '@local/dsh-superfish/schedule-host'
    - id: superagent-genui
      name: '@local/dsh-superfish/genui'
    - id: workspace-context
      name: '@local/dsh-superfish/workspace-context'
    - id: workspace-context-task-board
      name: '@local/dsh-superfish/workspace-context/task-board'
    - id: workspace-context-schedule
      name: '@local/dsh-superfish/workspace-context/schedule'
    - id: workspace-context-session
      name: '@local/dsh-superfish/workspace-context/session'
    - id: workspace-superagent
      name: '@local/dsh-superfish'
    - id: preset-workspace-superagent-router
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: workspace-superagent-router
        name: 大肥鱼
        description: 对话、盘点待办、定时总结和委派任务。后台执行按任务授权运行。
        plugins:
          - id: workspace-superagent-router-outer
            name: '@local/dsh-superfish/preset'
